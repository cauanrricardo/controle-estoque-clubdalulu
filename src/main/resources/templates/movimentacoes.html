<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Movimentações</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h4 th:text="'Movimentações - ' + ${produto.nome}"></h4>
            <div class="text-muted small">Estoque atual:
                <span class="badge text-bg-secondary" th:text="${produto.estoque}"></span>
            </div>
        </div>

        <a class="btn btn-outline-secondary" th:href="@{/web/produtos}">
            Voltar
        </a>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-sm">
                    <thead>
                    <tr>
                        <th>Tipo</th>
                        <th>Quantidade</th>
                        <th>Data</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="m : ${movimentacoes}">
                        <td>
              <span th:class="${m.tipo.name() == 'ENTRADA'} ? 'badge text-bg-success' : 'badge text-bg-warning'"
                    th:text="${m.tipo}">
              </span>
                        </td>
                        <td th:text="${m.quantidade}"></td>
                        <td th:text="${#temporals.format(m.dataHora, 'dd/MM/yyyy HH:mm')}"></td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(movimentacoes)}">
                        <td colspan="3" class="text-center text-muted">
                            Nenhuma movimentação registrada.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

</body>
</html>
