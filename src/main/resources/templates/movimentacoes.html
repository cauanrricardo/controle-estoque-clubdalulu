<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Movimentações</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

    <style>
        /* só UI */
        .page-title { line-height: 1.2; }
        .muted-label { font-size: .875rem; }
    </style>
</head>
<body class="bg-light">

<div class="container py-3 py-md-4">

    <!-- Header responsivo -->
    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-2 mb-3">
        <div>
            <h4 class="page-title mb-1" th:text="'Movimentações - ' + ${produto.nome}"></h4>
            <div class="text-muted muted-label">
                Estoque atual:
                <span class="badge text-bg-secondary align-middle" th:text="${produto.estoque}"></span>
            </div>
        </div>

        <div class="d-grid d-sm-block">
            <a class="btn btn-outline-secondary" th:href="@{/web/produtos}">
                Voltar
            </a>
        </div>
    </div>

    <!-- DESKTOP/TABLET: tabela -->
    <div class="card d-none d-md-block">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-sm align-middle mb-0">
                    <thead>
                    <tr>
                        <th style="width: 140px;">Tipo</th>
                        <th style="width: 140px;">Quantidade</th>
                        <th>Data</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="m : ${movimentacoes}">
                        <td>
              <span th:class="${m.tipo.name() == 'ENTRADA'} ? 'badge text-bg-success' : 'badge text-bg-warning'"
                    th:text="${m.tipo}">
              </span>
                        </td>
                        <td class="fw-semibold" th:text="${m.quantidade}"></td>
                        <td th:text="${#temporals.format(m.dataHora, 'dd/MM/yyyy HH:mm')}"></td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(movimentacoes)}">
                        <td colspan="3" class="text-center text-muted py-4">
                            Nenhuma movimentação registrada.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MOBILE: cards -->
    <div class="d-md-none">
        <div class="vstack gap-2">
            <div class="card" th:each="m : ${movimentacoes}">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start">
                        <div class="d-flex align-items-center gap-2">
                            <span th:class="${m.tipo.name() == 'ENTRADA'} ? 'badge text-bg-success' : 'badge text-bg-warning'"
                                  th:text="${m.tipo}"></span>
                            <span class="fw-semibold">Qtd:</span>
                            <span class="fw-semibold" th:text="${m.quantidade}"></span>
                        </div>
                    </div>

                    <div class="text-muted small mt-2">
                        <span th:text="${#temporals.format(m.dataHora, 'dd/MM/yyyy HH:mm')}"></span>
                    </div>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(movimentacoes)}" class="text-center text-muted py-4">
                Nenhuma movimentação registrada.
            </div>
        </div>
    </div>

</div>

</body>
</html>
