
<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Acesso - Controle de Estoque</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .pin-card {
            max-width: 380px;
            width: 100%;
        }

        /* inputs do PIN */
        .pin-inputs {
            display: flex;
            gap: .5rem;
            justify-content: center;
        }

        .pin-inputs input {
            width: 40px;
            height: 50px;
            text-align: center;
            font-size: 1.4rem;
            font-weight: bold;
            border: 2px solid #dee2e6;
            border-radius: .5rem;
            transition: border-color .2s;
        }

        .pin-inputs input:focus {
            border-color: #0d6efd;
            outline: none;
            box-shadow: 0 0 0 .2rem rgba(13, 110, 253, .25);
        }
    </style>
</head>
<body class="bg-light">

<div class="pin-card">
    <div class="card shadow-sm">
        <div class="card-body p-4">

            <div class="text-center mb-4">
                <h4 class="fw-bold mb-1">🔒 Acesso</h4>
                <p class="text-muted small mb-0">Digite o PIN de 6 dígitos</p>
            </div>

            <!-- Alerta de erro -->
            <div th:if="${param.error}" class="alert alert-danger text-center py-2" role="alert">
                PIN incorreto. Tente novamente.
            </div>

            <!-- Alerta de logout -->
            <div th:if="${param.logout}" class="alert alert-info text-center py-2" role="alert">
                Você saiu do sistema.
            </div>

            <form th:action="@{/login}" method="post">

                <!-- Campo hidden que recebe o PIN concatenado -->
                <input type="hidden" name="username" value="admin"/>
                <input type="hidden" id="pinCompleto" name="password" value=""/>

                <div class="pin-inputs mb-4">
                    <input type="password" maxlength="1" inputmode="numeric" pattern="[0-9]"
                           class="pin-digit" data-index="0" autocomplete="off" required/>
                    <input type="password" maxlength="1" inputmode="numeric" pattern="[0-9]"
                           class="pin-digit" data-index="1" autocomplete="off" required/>
                    <input type="password" maxlength="1" inputmode="numeric" pattern="[0-9]"
                           class="pin-digit" data-index="2" autocomplete="off" required/>
                    <input type="password" maxlength="1" inputmode="numeric" pattern="[0-9]"
                           class="pin-digit" data-index="3" autocomplete="off" required/>
                    <input type="password" maxlength="1" inputmode="numeric" pattern="[0-9]"
                           class="pin-digit" data-index="4" autocomplete="off" required/>
                    <input type="password" maxlength="1" inputmode="numeric" pattern="[0-9]"
                           class="pin-digit" data-index="5" autocomplete="off" required/>
                </div>

                <div class="d-grid">
                    <button class="btn btn-primary" type="submit" id="btnEntrar">Entrar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    const digits = document.querySelectorAll('.pin-digit');
    const pinField = document.getElementById('pinCompleto');

    function atualizarPin() {
        let pin = '';
        digits.forEach(d => pin += d.value);
        pinField.value = pin;
    }

    digits.forEach((input, i) => {
        input.addEventListener('input', () => {
            input.value = input.value.replace(/\D/g, ''); // só números
            atualizarPin();
            if (input.value && i < digits.length - 1) {
                digits[i + 1].focus();
            }
        });

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' && !input.value && i > 0) {
                digits[i - 1].focus();
            }
        });

        // colar PIN inteiro
        input.addEventListener('paste', (e) => {
            e.preventDefault();
            const text = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '');
            for (let j = 0; j < digits.length && j < text.length; j++) {
                digits[j].value = text[j];
            }
            atualizarPin();const next = Math.min(text.length, digits.length - 1);
            digits[next].focus();
        });
    });

    // foco automático no primeiro campo
    digits[0].focus();
</script>

</body>
</html>
